<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم ملوك الكاجوال</title>
<style>
body{font-family:Arial;background:#f5f5f5;margin:0;padding:20px}
.container{max-width:700px;margin:auto;background:white;padding:25px;border-radius:15px}
h1{text-align:center}
input,button{width:100%;padding:13px;margin:8px 0;box-sizing:border-box}
button{background:#111;color:white;border:0;border-radius:8px;font-size:16px}
.product{border:1px solid #ddd;padding:15px;margin-top:15px;border-radius:10px}
</style>
</head>

<body>
<div class="container">

<h1>لوحة تحكم ملوك الكاجوال</h1>

<h2>إضافة منتج جديد</h2>

<input id="name" type="text" placeholder="اسم القماش أو المنتج">
<input id="price" type="text" placeholder="السعر">
<input id="width" type="text" placeholder="العرض">
<input id="image" type="text" placeholder="رابط صورة المنتج">

<button onclick="addProduct()">إضافة المنتج</button>

<h2>المنتجات</h2>
<div id="products"></div>

</div>

<script>
let products = JSON.parse(localStorage.getItem("products") || "[]");

function showProducts(){
    const box = document.getElementById("products");
    box.innerHTML = "";

    products.forEach((p,index)=>{
        box.innerHTML += `
        <div class="product">
            <h3>${p.name}</h3>
            <p>السعر: ${p.price}</p>
            <p>العرض: ${p.width}</p>
            ${p.image ? `<img src="${p.image}" style="width:100%;max-width:300px">` : ""}
            <button onclick="deleteProduct(${index})">حذف المنتج</button>
        </div>`;
    });
}

function addProduct(){
    const name=document.getElementById("name").value;
    const price=document.getElementById("price").value;
    const width=document.getElementById("width").value;
    const image=document.getElementById("image").value;

    if(!name){
        alert("اكتب اسم المنتج");
        return;
    }

    products.push({name,price,width,image});
    localStorage.setItem("products",JSON.stringify(products));

    document.getElementById("name").value="";
    document.getElementById("price").value="";
    document.getElementById("width").value="";
    document.getElementById("image").value="";

    showProducts();
}

function deleteProduct(index){
    products.splice(index,1);
    localStorage.setItem("products",JSON.stringify(products));
    showProducts();
}

showProducts();
</script>

</body>
</html>
